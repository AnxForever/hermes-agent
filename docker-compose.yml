#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The entrypoint remaps the internal `hermes` user to these values via
# usermod/groupmod + gosu.
#
# Security notes:
#   - The dashboard binds to 0.0.0.0 inside the container, but Docker port
#     mapping restricts it to 127.0.0.1:9119 on the host (local-only).
#   - The API server binds to 0.0.0.0 inside the container so the dashboard
#     can reach it via docker-compose DNS (`gateway:8642`). Use an API key.
#   - If you override entrypoint, keep /opt/hermes/docker/entrypoint.sh in
#     the command chain. It drops root to the hermes user before gateway
#     files such as gateway.lock are created.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    # Expose API server port only to the internal Docker network so the
    # dashboard can proxy to it. NOT published to host — dashboard is the
    # only entry point for HTTP.
    expose:
      - "8642"
    volumes:
      - ~/.hermes:/opt/data
      # User-scoped uploads from /v1/uploads land here. Separate named
      # volume so backups/exports can target it independently.
      - hermes-uploads:/opt/uploads
      # Mount the team-config repo at the *same host path* so SOUL.md
      # (which is a host symlink to ~/hermes-team-config/SOUL.md) resolves
      # both inside and outside the container.
      - ~/hermes-team-config:/home/anx4758/hermes-team-config:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # API server for dashboard communication (internal Docker network)
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=0d8dacaa8a7b8553608ad8d20d15a8157e64e7efd02992cf
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:9119:9119"
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
      # Mount the team-config repo at the *same host path* so SOUL.md
      # (which is a host symlink to ~/hermes-team-config/SOUL.md) resolves
      # both inside and outside the container.
      - ~/hermes-team-config:/home/anx4758/hermes-team-config:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # Share the gateway signing key so the dashboard can verify JWTs
      # issued by /api/admin/login and /v1/auth/login interchangeably.
      - API_SERVER_KEY=0d8dacaa8a7b8553608ad8d20d15a8157e64e7efd02992cf
      # Set to 1 to require admin login on the dashboard. Off by default
      # so existing single-tenant setups keep working without a flag flip.
      - HERMES_DASHBOARD_REQUIRE_LOGIN=${HERMES_DASHBOARD_REQUIRE_LOGIN:-}
    # Bind 0.0.0.0 inside the container so Docker port mapping can forward
    # --host 0.0.0.0. Port mapped to 127.0.0.1:9119 on host for security.
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]

  # User-facing chat SPA served by nginx. The nginx container also acts as
  # a reverse proxy for /v1/* so the SPA can talk to the gateway without
  # exposing port 8642 to the host. SSE responses bypass buffering — see
  # docker/nginx/web-chat.conf.
  web-chat:
    image: nginx:1.27-alpine
    container_name: hermes-web-chat
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:9120:80"
    volumes:
      # Static SPA bundle, built into the hermes-agent image at
      # /opt/hermes/web-chat/dist by the Dockerfile.
      - web-chat-dist:/usr/share/nginx/html:ro
      - ./docker/nginx/web-chat.conf:/etc/nginx/conf.d/default.conf:ro

  # One-shot init container that copies the freshly-built web-chat bundle
  # from the hermes-agent image into the shared volume so nginx can serve
  # it. Runs each compose-up; exits when the copy succeeds.
  web-chat-build-copy:
    image: hermes-agent
    container_name: hermes-web-chat-build-copy
    depends_on:
      - gateway
    volumes:
      - web-chat-dist:/dist
    entrypoint: ["sh", "-c", "cp -r /opt/hermes/web-chat/dist/* /dist/ && echo 'web-chat bundle staged'"]
    restart: "no"

volumes:
  hermes-uploads: {}
  web-chat-dist: {}
