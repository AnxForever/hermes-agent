# Nginx config for the Hermes user-facing chat (`web-chat`).
#
# Layout in the nginx container:
#   /usr/share/nginx/html    ← web-chat/dist (mounted read-only)
#   /etc/nginx/conf.d/default.conf  ← this file (mounted read-only)
#
# Upstream: the `gateway` service on the docker-compose network, port
# 8642. SSE responses (/v1/chat/completions stream=true and
# /v1/runs/{id}/events) MUST NOT be buffered or nginx will hold tokens
# until the response ends. The explicit overrides below pin that off.

upstream hermes_gateway {
    server gateway:8642;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 60M;  # /v1/uploads cap is 50 MB; give a small buffer

    # ---- API + SSE proxy ----------------------------------------------
    location /v1/ {
        proxy_pass http://hermes_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Critical for SSE — keep tokens flowing as the model emits them.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- Static SPA ---------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
